<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="laser" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c81e4f"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="12" fill="#120a1f"/>

  <g filter="url(#glow)" opacity="0.95">
    <polygon points="8,56 20,28 14,24 24,52" fill="url(#laser)" opacity="0.9"/>
    <polygon points="14,24 24,52 30,44 20,16" fill="#ff477e" opacity="0.7"/>
    <polygon points="20,16 30,44 36,36 26,8" fill="#a855f7" opacity="0.6"/>
  </g>

  <circle cx="48" cy="14" r="3.5" fill="#ff477e" opacity="0.9" filter="url(#glow)"/>
  <circle cx="42" cy="22" r="2.5" fill="#ff477e" opacity="0.7"/>
  <circle cx="52" cy="20" r="2" fill="#c81e4f" opacity="0.6"/>

  <circle cx="32" cy="32" r="28" fill="none" stroke="#ff477e" stroke-width="0.8" opacity="0.25"/>
</svg>
